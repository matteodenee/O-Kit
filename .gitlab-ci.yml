stages:
  - validate
  - test
  - build
  - scan
  - deploy

k8s-lint:
  stage: validate
  image:
    name: bitnami/kubectl:latest
    entrypoint: [""]
  script:
    - kubectl kustomize k8s/services/ms-catalogue/
    - kubectl kustomize k8s/services/ms-utilisateur/
    - kubectl kustomize k8s/services/ms-commande/
    - kubectl kustomize infra/kubernetes/gateway/
    - kubectl kustomize infra/keycloak/
    - kubectl kustomize infra/kubernetes/overlays/user-staging/
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH'

k8s-check:
  stage: validate
  image:
    name: bitnami/kubectl:latest
    entrypoint: [""]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH'
  script:
    - mkdir -p ~/.kube
    - |
      if [ -n "$KUBECONFIG" ] && [ -f "$KUBECONFIG" ]; then
        cp "$KUBECONFIG" ~/.kube/config
      elif [ -n "$KUBE_CONFIG" ]; then
        echo "$KUBE_CONFIG" | base64 -d > ~/.kube/config
      else
        echo "Erreur: variable KUBECONFIG (fichier) ou KUBE_CONFIG (base64) requise"
        exit 1
      fi
    - chmod 600 ~/.kube/config
    - kubectl config set-context --current --namespace=polytech-dams5-07
    - kubectl --request-timeout=15s get pods
    - kubectl --request-timeout=15s get services
    - kubectl --request-timeout=15s get ingress
    - kubectl --request-timeout=15s describe resourcequota

test:ms-catalogue:
  stage: test
  image: eclipse-temurin:21-jdk-alpine
  before_script:
    - chmod +x backend/ms-catalogue/mvnw
  script:
    - cd backend/ms-catalogue
    - ./mvnw clean test
  artifacts:
    when: always
    reports:
      junit: backend/ms-catalogue/target/surefire-reports/TEST-*.xml
    paths:
      - backend/ms-catalogue/target/surefire-reports/
    expire_in: 1 week
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - backend/ms-catalogue/**/*
        - .gitlab-ci.yml
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - backend/ms-catalogue/**/*
        - .gitlab-ci.yml
    - if: '$CI_COMMIT_BRANCH'
      changes:
        - backend/ms-catalogue/**/*
        - .gitlab-ci.yml

test:ms-utilisateur:
  stage: test
  image: maven:3.9.11-eclipse-temurin-21-alpine
  services:
    - name: docker:27.3.1-dind
      alias: docker
      command: ["--tls=false"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  script:
    - cd backend/ms-utilisateur
    - mvn --batch-mode --no-transfer-progress clean verify
  artifacts:
    when: always
    reports:
      junit:
        - backend/ms-utilisateur/target/surefire-reports/TEST-*.xml
        - backend/ms-utilisateur/target/failsafe-reports/TEST-*.xml
    paths:
      - backend/ms-utilisateur/target/surefire-reports/
      - backend/ms-utilisateur/target/failsafe-reports/
    expire_in: 1 week
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - backend/ms-utilisateur/**/*
        - .gitlab-ci.yml
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - backend/ms-utilisateur/**/*
        - .gitlab-ci.yml
    - if: '$CI_COMMIT_BRANCH'
      changes:
        - backend/ms-utilisateur/**/*
        - .gitlab-ci.yml

test:api-gateway:
  stage: test
  image: maven:3.9.11-eclipse-temurin-21-alpine
  script:
    - cd services/api-gateway
    - mvn --batch-mode --no-transfer-progress clean verify
  artifacts:
    when: always
    reports:
      junit: services/api-gateway/target/surefire-reports/TEST-*.xml
    expire_in: 1 week
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - services/api-gateway/**/*
        - infra/kubernetes/gateway/**/*
        - .gitlab-ci.yml
    - if: '$CI_COMMIT_BRANCH'
      changes:
        - services/api-gateway/**/*
        - infra/kubernetes/gateway/**/*
        - .gitlab-ci.yml

test:keycloak-extension:
  stage: test
  image: maven:3.9.11-eclipse-temurin-21-alpine
  script:
    - cd infra/keycloak/extensions/direct-realm-roles
    - mvn --batch-mode --no-transfer-progress clean verify
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - infra/keycloak/**/*
        - .gitlab-ci.yml
    - if: '$CI_COMMIT_BRANCH'
      changes:
        - infra/keycloak/**/*
        - .gitlab-ci.yml

.build-user-stack-image:
  stage: build
  image: docker:27.3.1
  services:
    - name: docker:27.3.1-dind
      alias: docker
      command: ["--tls=false"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - docker build --pull -t "$CI_REGISTRY_IMAGE/$IMAGE_NAME:$CI_COMMIT_SHORT_SHA" "$BUILD_CONTEXT"
    - docker push "$CI_REGISTRY_IMAGE/$IMAGE_NAME:$CI_COMMIT_SHORT_SHA"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

build:user-service:
  extends: .build-user-stack-image
  variables:
    IMAGE_NAME: user-service
    BUILD_CONTEXT: backend/ms-utilisateur

build:keycloak:
  extends: .build-user-stack-image
  variables:
    IMAGE_NAME: keycloak
    BUILD_CONTEXT: infra/keycloak

build:api-gateway:
  extends: .build-user-stack-image
  variables:
    IMAGE_NAME: api-gateway
    BUILD_CONTEXT: services/api-gateway

.scan-user-stack-image:
  stage: scan
  image:
    name: aquasec/trivy:0.58.1
    entrypoint: [""]
  variables:
    TRIVY_USERNAME: $CI_REGISTRY_USER
    TRIVY_PASSWORD: $CI_REGISTRY_PASSWORD
  script:
    - trivy image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed "$CI_REGISTRY_IMAGE/$IMAGE_NAME:$CI_COMMIT_SHORT_SHA"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

scan:user-service:
  extends: .scan-user-stack-image
  needs: ["build:user-service"]
  variables:
    IMAGE_NAME: user-service

scan:keycloak:
  extends: .scan-user-stack-image
  needs: ["build:keycloak"]
  variables:
    IMAGE_NAME: keycloak

scan:api-gateway:
  extends: .scan-user-stack-image
  needs: ["build:api-gateway"]
  variables:
    IMAGE_NAME: api-gateway

deploy:user-stack:
  stage: deploy
  image:
    name: bitnami/kubectl:latest
    entrypoint: [""]
  needs:
    - scan:user-service
    - scan:keycloak
    - scan:api-gateway
  before_script:
    - mkdir -p ~/.kube
    - echo "$KUBE_CONFIG" | base64 -d > ~/.kube/config
    - chmod 600 ~/.kube/config
    - kubectl config set-context --current --namespace=polytech-dams5-07
  script:
    - infra/kubernetes/scripts/deploy-user-stack.sh "$CI_COMMIT_SHORT_SHA"
  environment:
    name: polytech-dams5-07
    url: https://dams5-07.students.polytech.lange.xyz
  when: manual
  allow_failure: false
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
