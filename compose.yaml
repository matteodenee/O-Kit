services:
  mailpit:
    image: axllent/mailpit:v1.31.5
    restart: unless-stopped
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: 100
    ports:
      - "127.0.0.1:8025:8025"
    volumes:
      - mailpit_data:/data
    mem_limit: 128m

  keycloak:
    build:
      context: ./infra/keycloak
    command:
      - start-dev
      - --import-realm
    restart: unless-stopped
    depends_on:
      - mailpit
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Define KEYCLOAK_ADMIN_PASSWORD in .env}
      KC_DB: dev-file
    ports:
      - "127.0.0.1:8090:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./infra/keycloak/import:/opt/keycloak/data/import:ro
      - ./infra/keycloak/themes:/opt/keycloak/themes:ro
    mem_limit: 768m

  postgres:
    image: postgres:18.6-alpine3.24
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${USER_DB_NAME:-okit_users}
      POSTGRES_USER: ${USER_DB_USERNAME:-okit_user}
      POSTGRES_PASSWORD: ${USER_DB_PASSWORD:?Define USER_DB_PASSWORD in .env}
      CATALOGUE_DB_NAME: ${CATALOGUE_DB_NAME:-okit_catalogue}
      CATALOGUE_DB_USERNAME: ${CATALOGUE_DB_USERNAME:-okit_catalogue}
      CATALOGUE_DB_PASSWORD: ${CATALOGUE_DB_PASSWORD:?Define CATALOGUE_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./infra/postgres/10-ensure-catalogue-db.sh:/docker-entrypoint-initdb.d/10-ensure-catalogue-db.sh:ro
      - ./infra/postgres/catalogue-demo-data.sql:/opt/okit/catalogue-demo-data.sql:ro
      - ./infra/postgres/seed-catalogue-demo.sh:/opt/okit/seed-catalogue-demo.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 512m

  user-service:
    build:
      context: ./backend/ms-utilisateur
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      USER_DB_HOST: ${USER_DB_HOST:-postgres}
      USER_DB_PORT: ${USER_DB_PORT:-5432}
      USER_DB_NAME: ${USER_DB_NAME:-okit_users}
      USER_DB_USERNAME: ${USER_DB_USERNAME:-okit_user}
      USER_DB_PASSWORD: ${USER_DB_PASSWORD:?Define USER_DB_PASSWORD in .env}
      OIDC_ISSUER_URI: http://localhost:8090/realms/okit
      OIDC_JWK_SET_URI: http://keycloak:8080/realms/okit/protocol/openid-connect/certs
    ports:
      - "127.0.0.1:8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider http://127.0.0.1:8081/health/readiness"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
    mem_limit: 512m

  catalogue-service:
    build:
      context: ./backend/ms-catalogue
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${CATALOGUE_DB_NAME:-okit_catalogue}
      SPRING_DATASOURCE_USERNAME: ${CATALOGUE_DB_USERNAME:-okit_catalogue}
      SPRING_DATASOURCE_PASSWORD: ${CATALOGUE_DB_PASSWORD:?Define CATALOGUE_DB_PASSWORD in .env}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    expose:
      - "8082"
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider http://127.0.0.1:8082/actuator/health/readiness"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
    mem_limit: 512m

  api-gateway:
    build:
      context: ./services/api-gateway
    restart: unless-stopped
    depends_on:
      user-service:
        condition: service_healthy
      catalogue-service:
        condition: service_healthy
    environment:
      USER_SERVICE_URL: http://user-service:8081
      CATALOGUE_SERVICE_URL: http://catalogue-service:8082
      OIDC_ISSUER_URI: http://localhost:8090/realms/okit
      OIDC_JWK_SET_URI: http://keycloak:8080/realms/okit/protocol/openid-connect/certs
      CORS_ALLOWED_ORIGIN: http://localhost:19006
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
    mem_limit: 512m

volumes:
  keycloak_data:
  mailpit_data:
  postgres_data:
