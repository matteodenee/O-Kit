openapi: 3.0.3
info:
  title: O'kit Catalogue API
  version: 1.1.0
  description: >-
    Contrat du catalogue utilisé par l'application acheteur et le backoffice
    vendeur. Les lectures exigent un JWT valide. Les écritures sont réservées
    à un compte portant directement SELLER sans attribution directe de BUYER.
servers:
  - url: /api/v1
paths:
  /products:
    get:
      summary: Lister les produits du catalogue
      operationId: listProducts
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EquipeId'
        - $ref: '#/components/parameters/SaisonId'
        - $ref: '#/components/parameters/MarqueId'
        - $ref: '#/components/parameters/Status'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Page de produits retournée avec succès.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      summary: Créer un produit
      description: >-
        Réservé au rôle vendeur. Les identifiants de saison, marque et TVA
        doivent déjà exister. Le Catalogue ne fournit pas encore d'API de
        consultation de ces référentiels.
      operationId: createProduct
      security:
        - sellerBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductCreateInput'
      responses:
        '201':
          description: Produit créé.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /products/{id}:
    parameters:
      - $ref: '#/components/parameters/ProductId'
    get:
      summary: Consulter un produit
      operationId: getProduct
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Détail du produit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      summary: Modifier partiellement un produit
      description: >-
        Modifie uniquement les champs scalaires exposés. Les relations saison,
        marque, TVA et équipe ne sont pas modifiables par cet endpoint.
      operationId: updateProduct
      security:
        - sellerBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductUpdateInput'
      responses:
        '200':
          description: Produit modifié.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /products/{id}/stock-status:
    parameters:
      - $ref: '#/components/parameters/ProductId'
    patch:
      summary: Modifier la disponibilité globale d'un produit
      operationId: updateProductStockStatus
      security:
        - sellerBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enStock]
              properties:
                enStock:
                  type: boolean
      responses:
        '200':
          description: Disponibilité mise à jour.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    sellerBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT du client vendeur avec SELLER directement attribué et sans BUYER direct.
  parameters:
    ProductId:
      in: path
      name: id
      required: true
      schema:
        type: integer
        format: int64
    EquipeId:
      in: query
      name: equipeId
      schema:
        type: integer
        format: int64
    SaisonId:
      in: query
      name: saisonId
      schema:
        type: integer
        format: int64
    MarqueId:
      in: query
      name: marqueId
      schema:
        type: integer
        format: int64
    Status:
      in: query
      name: statut
      schema:
        $ref: '#/components/schemas/ProductStatus'
    Page:
      in: query
      name: page
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      in: query
      name: size
      schema:
        type: integer
        minimum: 1
        default: 10
  responses:
    BadRequest:
      description: Données invalides.
    Unauthorized:
      description: Token absent, expiré ou invalide.
    Forbidden:
      description: Le compte ne possède pas l'autorisation vendeur requise.
    NotFound:
      description: Produit ou référentiel introuvable.
  schemas:
    ProductStatus:
      type: string
      enum: [ACTIF, DESACTIVE]
    ProductSummary:
      type: object
      required: [id, titre, prixHT, prixTTC, enStock, statut]
      properties:
        id:
          type: integer
          format: int64
        titre:
          type: string
        prixHT:
          type: number
        prixTTC:
          type: number
        enStock:
          type: boolean
        nomMarque:
          type: string
          nullable: true
        nomSaison:
          type: string
          nullable: true
        nomEquipe:
          type: string
          nullable: true
        statut:
          $ref: '#/components/schemas/ProductStatus'
    ProductPage:
      type: object
      required: [content, page, size, totalElements, totalPages, isLast]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/ProductSummary'
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
        isLast:
          type: boolean
    ProductCreateInput:
      type: object
      required: [titre, prixDeBase, idSaison, idMarque, idTauxTVA]
      properties:
        titre:
          type: string
          minLength: 1
        description:
          type: string
        prixDeBase:
          type: number
          minimum: 0
          exclusiveMinimum: true
        poids:
          type: number
          minimum: 0
          exclusiveMinimum: true
        couleursPrincipales:
          type: string
        impactEnvi:
          type: string
        estFlocable:
          type: boolean
        statut:
          $ref: '#/components/schemas/ProductStatus'
        idSaison:
          type: integer
          format: int64
        idMarque:
          type: integer
          format: int64
        idTauxTVA:
          type: integer
          format: int64
        idEquipe:
          type: integer
          format: int64
          nullable: true
    ProductUpdateInput:
      type: object
      properties:
        titre:
          type: string
        description:
          type: string
        prixDeBase:
          type: number
          minimum: 0
          exclusiveMinimum: true
        poids:
          type: number
          minimum: 0
          exclusiveMinimum: true
        couleursPrincipales:
          type: string
        impactEnvi:
          type: string
        estFlocable:
          type: boolean
        statut:
          $ref: '#/components/schemas/ProductStatus'
    ProductDetail:
      type: object
      required: [id, titre, prixDeBaseHT, prixTTC, prixApresPromotionTTC, enStock, statut, tauxTva]
      properties:
        id:
          type: integer
          format: int64
        titre:
          type: string
        description:
          type: string
          nullable: true
        prixDeBaseHT:
          type: number
        prixTTC:
          type: number
        prixApresPromotionTTC:
          type: number
        poids:
          type: number
          nullable: true
        couleursPrincipales:
          type: string
          nullable: true
        impactEnvi:
          type: string
          nullable: true
        estFlocable:
          type: boolean
          nullable: true
        enStock:
          type: boolean
        statut:
          $ref: '#/components/schemas/ProductStatus'
        marque:
          type: object
          nullable: true
        saison:
          type: object
          nullable: true
        equipe:
          type: object
          nullable: true
        tauxTva:
          type: number
        promotionActive:
          type: object
          nullable: true
