apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: okit-gateway
  labels:
    app.kubernetes.io/name: okit-gateway
    app.kubernetes.io/part-of: okit
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-etudiants
spec:
  ingressClassName: traefik
  rules:
    - host: dams5-07.students.polytech.lange.xyz
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  name: http
          - path: /realms
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port:
                  name: http
          - path: /resources
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port:
                  name: http
  tls:
    - hosts:
        - dams5-07.students.polytech.lange.xyz
      secretName: nginx-tls
