apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: mcp-service
  labels:
    app.kubernetes.io/name: mcp-service
    app.kubernetes.io/part-of: okit
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: mcp-service
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 30s
