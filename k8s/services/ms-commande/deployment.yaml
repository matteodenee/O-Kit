apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-commande
  labels:
    app.kubernetes.io/name: ms-commande
    app.kubernetes.io/instance: okit
    app.kubernetes.io/part-of: okit
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ms-commande
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ms-commande
        app.kubernetes.io/instance: okit
        app.kubernetes.io/part-of: okit
        app.kubernetes.io/component: backend
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: gitlab-registry
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ms-commande
          image: ms-commande
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8085
              protocol: TCP
          envFrom:
            - configMapRef:
                name: ms-commande-config
          env:
            # Secret créé directement dans le cluster, jamais versionné
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ms-commande-secrets
                  key: database-password
            - name: STOCK_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ms-commande-secrets
                  key: stock-client-secret
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          # Profil B (Java) réduit : 1 réplica, faible trafic
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
      terminationGracePeriodSeconds: 40
