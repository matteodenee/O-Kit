apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: ms-commande
  labels:
    app.kubernetes.io/name: ms-commande
    app.kubernetes.io/instance: okit
    app.kubernetes.io/part-of: okit
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: ms-commande
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 30s
      scrapeTimeout: 10s
