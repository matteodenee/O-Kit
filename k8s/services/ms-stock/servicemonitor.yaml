apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: ms-stock
  labels:
    app.kubernetes.io/name: ms-stock
    app.kubernetes.io/instance: okit
    app.kubernetes.io/part-of: okit
    app.kubernetes.io/component: backend
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: ms-stock
      app.kubernetes.io/instance: okit
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 30s